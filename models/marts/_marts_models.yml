version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests: [not_null, unique]

  - name: dim_products
    columns:
      - name: product_sku
        tests: [not_null, unique]

  - name: dim_stores
    columns:
      - name: store_id
        tests: [not_null, unique]

  - name: fct_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: store_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id
      - name: order_total
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_order_items
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_sku
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_sku
